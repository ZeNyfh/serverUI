<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lentron</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <aside>
      <header>
        <a class="brand" href="/">
          <img src="/assets/favicon.png" alt="" />
          <span>Lentron</span>
        </a>
      </header>
      <nav id="sidebar-items" class="sidebar-items" aria-label="Items"></nav>
      <div class="sidebar-footer">
        <div class="profile-summary">
          <img id="profile-image" src="/assets/profile-placeholder.svg" alt="Profile picture" />
          <span id="username"></span>
        </div>
        <div class="sidebar-actions">
          <button id="settings-button" type="button">Settings</button>
          <button id="logout-button" type="button">Log out</button>
        </div>
      </div>
    </aside>
    <main>
      <section id="cards-container" aria-label="Items"></section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ansi_up@5.1.0/ansi_up.js"></script>
    <script src="/js/script.js"></script>
  </body>
</html>
