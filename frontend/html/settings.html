<section id="settings-panel" hidden>
  <h2>Settings</h2>
  <form id="settings-form">
    <label>Username <input id="settings-username" required /></label>
    <label>Current password <input id="current-password" type="password" required /></label>
    <label>New password <input id="new-password" type="password" /></label>
    <button type="submit">Save changes</button>
  </form>
  <p id="settings-message" aria-live="polite"></p>
  <form id="profile-image-form">
    <label>Profile picture <input id="profile-image-input" name="profileImage" type="file" accept="image/png,image/jpeg,image/gif,image/webp" required /></label>
    <button type="submit">Upload picture</button>
  </form>
  <p id="profile-image-message" aria-live="polite"></p>
</section>
